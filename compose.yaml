# Buyers run this instead of installing Chromium on the host OS.
# Dashboard: http://127.0.0.1:3847/   MCP: http://127.0.0.1:3847/mcp
# Edit config/sites.json, then: docker compose up --build
services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3847:3847"
    environment:
      ADA_SCANNER_HOST: "0.0.0.0"
      PORT: "3847"
      PLAYWRIGHT_HTML_OPEN: "never"
      PLAYWRIGHT_NO_SANDBOX: "1"
      # Optional: ADA_SCANNER_EXPIRES=2027-12-31
    volumes:
      - ./config:/app/config
      - ./spreadsheets:/app/spreadsheets
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./allure-reports:/app/allure-reports
    shm_size: "2gb"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
